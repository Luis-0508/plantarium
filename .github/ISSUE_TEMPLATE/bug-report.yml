name: Bug report
description: Something renders incorrectly, behaves unexpectedly or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Rendering issues often depend on the browser and GPU, so the environment details below help a lot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the plant, the view (Pflanze / Wurzeln / Anatomie / Vergleichen) and any pot or soil toggles.
      placeholder: |
        1. Open the Bergpalme
        2. Switch to the root view
        3. Zoom in with +
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop / laptop
        - Tablet
        - Phone
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 131, Chrome 129, Safari 18
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, iOS 18, Android 15
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or videos here.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors or warnings from the browser developer console, if any.
      render: text
