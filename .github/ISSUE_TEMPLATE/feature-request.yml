name: Feature request
description: Suggest an idea, a new plant, a growth form or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What is missing or hard to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed idea
      description: Describe what you would like to see. Sketches or references are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      options:
        - label: 3D scene / procedural geometry
        - label: Plant data
        - label: UI / data visualizations
        - label: Repository infrastructure (CI, docs, tooling)
