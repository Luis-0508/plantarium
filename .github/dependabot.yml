version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "10 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
